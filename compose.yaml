services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: routing
      POSTGRES_DB: routing
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - routing-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U routing']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  routing-data:
